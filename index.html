<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rit Registratie App</title>
    
    <!-- Leaflet CSS voor de kaart -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 15px;
            margin: 0;
            text-align: center;
        }
        #app-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #map {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button.stop {
            background-color: #dc3545;
        }
        #log {
            margin-top: 15px;
            text-align: left;
            background: #eee;
            padding: 10px;
            border-radius: 6px;
            height: 140px;
            overflow-y: auto;
            font-size: 12px;
        }
        #black-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            color: #555;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #black-screen h2 { color: #222; font-size: 16px; }
    </style>
</head>
<body>

    <div id="app-container">
        <h2>Rit Registratie & Kaart</h2>
        
        <!-- Live kaart -->
        <div id="map"></div>
        
        <p id="status-tekst" style="font-size: 13px; margin: 5px 0;">Klaar om te starten</p>
        
        <button id="main-btn" onclick="toggleTracking()">Start Rit & Zwart Scherm</button>
        
        <h3>Logboek:</h3>
        <div id="log">Nog geen rit gestart...</div>
    </div>

    <!-- Pikkedonker scherm -->
    <div id="black-screen" onclick="checkUnlock()">
        <h2>Rit is gaande op achtergrond...</h2>
        <p style="color: #333; font-size: 12px;">(Tik 3 keer snel hier om te ontgrendelen)</p>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    let isTracking = false;
    let watchId = null;
    let wakeLock = null;
    let tapCount = 0;
    
    let map = null;
    let marker = null;
    let polyline = null;
    let routeCoordinates = [];

    // Rit gegevens
    let ritStartTijd = "";
    let ritStartAdres = "";
    let laatsteAdres = "";

    // Jouw Google Apps Script URL
    const googleScriptUrl = "https://script.google.com/macros/s/AKfycbz6Zd0ChMLyO-qp6pRZx86yuGNlgzTHcNr6cMo_B9L8M_C7l0FbNw43PQSz1tK9gl_rAg/exec"; 

    window.onload = function() {
        map = L.map('map').setView([52.3676, 4.9041], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        polyline = L.polyline([], {color: 'red', weight: 4}).addTo(map);
    };

    async function toggleTracking() {
        if (!isTracking) {
            // --- START RIT ---
            isTracking = true;
            routeCoordinates = [];
            polyline.setLatLngs([]);
            
            ritStartTijd = new Date().toLocaleString();
            ritStartAdres = "Adres wordt bepaald...";
            
            document.getElementById('main-btn').innerText = "Stop Rit";
            document.getElementById('main-btn').className = "stop";
            document.getElementById('status-tekst').innerText = "Rit gestart om " + ritStartTijd;
            
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { console.log(err); }

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(successPosition, errorPosition, {
                    enableHighAccuracy: true,
                    maximumAge: 5000,
                    timeout: 20000
                });
            }
            
            document.getElementById('black-screen').style.display = 'flex';
            logMessage("🚗 Rit gestart...");
        } else {
            // --- STOP RIT ---
            stopTracking();
        }
    }

    async function successPosition(position) {
        if (!isTracking) return;

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const latLng = [lat, lon];
        
        if (map) {
            if (!marker) {
                marker = L.marker(latLng).addTo(map);
            } else {
                marker.setLatLng(latLng);
            }
            map.setView(latLng, 15);
            routeCoordinates.push(latLng);
            polyline.setLatLngs(routeCoordinates);
        }

        // Haal direct adres op
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await response.json();
            if (data && data.display_name) {
                laatsteAdres = data.display_name;
                if (ritStartAdres === "Adres wordt bepaald...") {
                    ritStartAdres = laatsteAdres; // Dit is ons startadres
                    logMessage(`Startadres vastgesteld: ${ritStartAdres}`);
                }
            }
        } catch (e) {
            laatsteAdres = "Onbekend adres";
        }
    }

    function errorPosition(error) {
        logMessage("GPS Fout: " + error.message);
    }

    async function stopTracking() {
        isTracking = false;
        
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
        
        document.getElementById('black-screen').style.display = 'none';
        document.getElementById('main-btn').innerText = "Start Rit & Zwart Scherm";
        document.getElementById('main-btn').className = "";
        
        const ritEindTijd = new Date().toLocaleString();
        const ritEindAdres = laatsteAdres || "Onbekend eindadres";

        logMessage(`🏁 <b>Rit beëindigd!</b><br>Start: ${ritStartAdres}<br>Eind: ${ritEindAdres}`);
        document.getElementById('status-tekst').innerText = "Rit opgeslagen!";

        // Stuur de complete ritgegevens naar Google Spreadsheet
        if (googleScriptUrl) {
            fetch(googleScriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: "rit",
                    startTijd: ritStartTijd,
                    startPlaats: ritStartAdres,
                    eindTijd: ritEindTijd,
                    eindPlaats: ritEindAdres
                })
            }).catch(err => console.log("Google sync fout:", err));
        }
    }

    function logMessage(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += msg + "<br><hr>";
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function checkUnlock() {
        tapCount++;
        setTimeout(() => { tapCount = 0; }, 1000);
        if (tapCount >= 3) {
            if (confirm("Wil je de rit stoppen en opslaan?")) {
                stopTracking();
            }
        }
    }
</script>

</body>
</html>
