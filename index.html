<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker & Ritregistratie</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 15px; text-align: center; margin: 0; }
        #app-container { max-width: 500px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #map { width: 100%; height: 200px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ccc; }
        .optie-box { text-align: left; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        button.stop { background-color: #dc3545; }
        #log { margin-top: 15px; text-align: left; background: #eee; padding: 10px; border-radius: 6px; height: 110px; overflow-y: auto; font-size: 12px; }
        #black-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; color: #555; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        #black-screen h2 { color: #222; font-size: 16px; }
    </style>
</head>
<body>

    <div id="app-container">
        <h2>GPS Tracker & Rit</h2>
        <div id="map"></div>
        
        <div class="optie-box">
            <label><input type="checkbox" id="gebruik-zwart-scherm" checked> Start met zwart scherm (batterij besparen)</label><br><br>
            <label>Verstuur update elke: 
                <select id="update-interval">
                    <option value="60000">1 minuut</option>
                    <option value="300000">5 minuten</option>
                    <option value="900000">15 minuten</option>
                    <option value="1800000" selected>30 minuten (Half uur)</option>
                </select>
            </label>
        </div>

        <p id="status-tekst" style="font-size: 13px;">Klaar om te starten</p>
        <button id="main-btn" onclick="toggleTracking()">Start Rit</button>
        <div id="log">Nog niet gestart...</div>
    </div>

    <div id="black-screen" onclick="checkUnlock()">
        <h2>Rit is gaande op achtergrond...</h2>
        <p style="color: #333; font-size: 12px;">(Tik 3 keer snel om te ontgrendelen)</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    let isTracking = false;
    let watchId = null;
    let wakeLock = null;
    let tapCount = 0;
    let map = null, marker = null, polyline = null, routeCoordinates = [];
    
    let ritStartTijdObj = null;
    let ritStartTijdStr = "", ritStartAdres = "", laatsteAdres = "";
    let lastLiveSend = 0;

    const googleScriptUrl = "https://script.google.com/macros/s/AKfycbz6Zd0ChMLyO-qp6pRZx86yuGNlgzTHcNr6cMo_B9L8M_C7l0FbNw43PQSz1tK9gl_rAg/exec";

    window.onload = function() {
        map = L.map('map').setView([52.3676, 4.9041], 13);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);
        polyline = L.polyline([], {color: 'red', weight: 4}).addTo(map);
    };

    async function toggleTracking() {
        if (!isTracking) {
            isTracking = true;
            routeCoordinates = [];
            polyline.setLatLngs([]);
            ritStartTijdObj = new Date();
            ritStartTijdStr = ritStartTijdObj.toLocaleTimeString();
            ritStartAdres = "Adres wordt bepaald...";
            
            document.getElementById('main-btn').innerText = "Stop Rit";
            document.getElementById('main-btn').className = "stop";
            document.getElementById('status-tekst').innerText = "Rit gestart...";
            
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(successPosition, errorPosition, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
            }

            if (document.getElementById('gebruik-zwart-scherm').checked) {
                document.getElementById('black-screen').style.display = 'flex';
            } else {
                document.getElementById('black-screen').style.display = 'none';
            }

            logMessage("🚗 Rit gestart.");
        } else {
            stopTracking();
        }
    }

    async function successPosition(position) {
        if (!isTracking) return;
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const latLng = [lat, lon];
        
        if (map) {
            if (!marker) marker = L.marker(latLng).addTo(map);
            else marker.setLatLng(latLng);
            map.setView(latLng, 15);
            routeCoordinates.push(latLng);
            polyline.setLatLngs(routeCoordinates);
        }

        let adres = `GPS Locatie (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await res.json();
            if (data && data.display_name) adres = data.display_name;
        } catch (e) {}

        if (ritStartAdres === "Adres wordt bepaald..." || ritStartAdres.includes("GPS Locatie")) {
            ritStartAdres = adres;
        }
        laatsteAdres = adres;

        // Pak gekozen interval (bijv. 30 minuten = 1800000 ms)
        const gekozenInterval = parseInt(document.getElementById('update-interval').value);
        const now = new Date().getTime();
        
        if (now - lastLiveSend > gekozenInterval && googleScriptUrl) {
            lastLiveSend = now;
            fetch(googleScriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: "live", tijd: new Date().toLocaleTimeString(), lat: lat, lon: lon, adres: laatsteAdres })
            }).catch(err => console.log(err));
            
            logMessage("📍 Periodieke locatie verzonden.");
        }
    }

    function errorPosition(error) { logMessage("GPS Fout: " + error.message); }

    function stopTracking() {
        isTracking = false;
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
        
        document.getElementById('black-screen').style.display = 'none';
        document.getElementById('main-btn').innerText = "Start Rit";
        document.getElementById('main-btn').className = "";
        
        const ritEindTijdObj = new Date();
        const ritEindTijdStr = ritEindTijdObj.toLocaleTimeString();
        
        // Bereken duur in minuten
        const duurMinuten = Math.round((ritEindTijdObj - ritStartTijdObj) / 60000);
        const duurTekst = `${duurMinuten} minuten`;

        logMessage(`🏁 Rit gestopt. Duur: ${duurTekst}`);

        // Stuur complete ritgegevens naar Google Sheets (tabblad Ritten)
        if (googleScriptUrl) {
            fetch(googleScriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: "rit",
                    startTijd: ritStartTijdStr,
                    startPlaats: ritStartAdres,
                    eindTijd: ritEindTijdStr,
                    eindPlaats: laatsteAdres,
                    duur: duurTekst
                })
            }).catch(err => console.log(err));
        }
    }

    function logMessage(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += msg + "<br>";
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function checkUnlock() {
        tapCount++;
        setTimeout(() => { tapCount = 0; }, 1000);
        if (tapCount >= 3 && confirm("Rit stoppen?")) stopTracking();
    }
</script>
</body>
</html>
