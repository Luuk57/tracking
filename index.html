<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking, Kaart & Adres Monitor</title>
    
    <!-- Leaflet CSS voor de kaart -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 15px;
            margin: 0;
            text-align: center;
        }
        #app-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* De afmeting van de kaart in het scherm */
        #map {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        #log {
            margin-top: 15px;
            text-align: left;
            background: #eee;
            padding: 10px;
            border-radius: 6px;
            height: 150px;
            overflow-y: auto;
            font-size: 12px;
        }
        #black-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            color: #555;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #black-screen h2 { color: #222; font-size: 16px; }
    </style>
</head>
<body>

    <div id="app-container">
        <h2>GPS Tracker & Kaart</h2>
        
        <!-- Hier verschijnt de live kaart -->
        <div id="map"></div>
        
        <p style="font-size: 13px; margin: 5px 0;">Zet tracking aan, het scherm wordt zwart.</p>
        <button onclick="startTracking()">Start Tracking & Zwart Scherm</button>
        
        <h3>Logboek:</h3>
        <div id="log">Nog niet gestart...</div>
    </div>

    <!-- Pikkedonker scherm om aanraking te voorkomen -->
    <div id="black-screen" onclick="checkUnlock()">
        <h2>App draait op achtergrond...</h2>
        <p style="color: #333; font-size: 12px;">(Tik 3 keer snel hier om te ontgrendelen)</p>
    </div>

    <!-- Leaflet JS voor de kaart logica -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    let watchId = null;
    let wakeLock = null;
    let tapCount = 0;
    let lastLogTime = 0;
    
    let map = null;
    let marker = null;
    let polyline = null;
    let routeCoordinates = [];

    // Jouw Google Apps Script URL
    const googleScriptUrl = "https://script.google.com/macros/s/AKfycbz6Zd0ChMLyO-qp6pRZx86yuGNlgzTHcNr6cMo_B9L8M_C7l0FbNw43PQSz1tK9gl_rAg/exec"; 

    // Interval ingesteld op 10 seconden
    const intervalTijdMS = 10000; 

    // Initialiseer direct een standaard kaart bij openen (bijv. gecentreerd op Nederland)
    window.onload = function() {
        map = L.map('map').setView([52.3676, 4.9041], 13); // Start in Amsterdam of jouw eerste GPS fix
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        polyline = L.polyline([], {color: 'red', weight: 4}).addTo(map);
    };

    async function startTracking() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                logMessage("Wake Lock ingeschakeld.");
            }
        } catch (err) {
            logMessage("Wake Lock fout: " + err.message);
        }

        if ("geolocation" in navigator) {
            logMessage("Start GPS-zoektocht met kaart...");
            watchId = navigator.geolocation.watchPosition(successPosition, errorPosition, {
                enableHighAccuracy: true,
                maximumAge: 10000,
                timeout: 20000
            });
        } else {
            alert("Geen GPS beschikbaar.");
        }

        document.getElementById('black-screen').style.display = 'flex';
    }

    async function successPosition(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const latLng = [lat, lon];
        
        // Werk de kaart direct bij (ook als de log-tijd nog niet om is, is wel zo fijn voor de kaart)
        if (map) {
            if (!marker) {
                marker = L.marker(latLng).addTo(map).bindPopup("Je bent hier").openPopup();
            } else {
                marker.setLatLng(latLng);
            }
            map.setView(latLng, 15); // Zoom mee met jouw locatie

            routeCoordinates.push(latLng);
            polyline.setLatLngs(routeCoordinates);
        }

        const now = new Date().getTime();
        // Controleer of er genoeg tijd verstreken is om te loggen naar Google / Logboek
        if (now - lastLogTime < intervalTijdMS) {
            return; 
        }
        lastLogTime = now;
        const tijdstip = new Date().toLocaleTimeString();
        
        // Vertaal coördinaten naar een leesbaar adres via OpenStreetMap
        let adres = "Adres aan het ophalen...";
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await response.json();
            if (data && data.display_name) {
                adres = data.display_name;
            }
        } catch (e) {
            adres = "Kon adres niet laden";
        }

        logMessage(`[${tijdstip}] 📍 <b>${adres}</b>`);

        // Stuur door naar Google Spreadsheet
        if (googleScriptUrl) {
            fetch(googleScriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tijd: tijdstip, lat: lat, lon: lon, adres: adres })
            }).catch(err => console.log("Google sync fout:", err));
        }
    }

    function errorPosition(error) {
        logMessage("GPS Fout: " + error.message);
    }

    function logMessage(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += msg + "<br>";
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function checkUnlock() {
        tapCount++;
        setTimeout(() => { tapCount = 0; }, 1000);
        if (tapCount >= 3) {
            if (confirm("Wil je de tracking stoppen?")) {
                stopTracking();
            }
        }
    }

    function stopTracking() {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
        document.getElementById('black-screen').style.display = 'none';
        logMessage("<b>Tracking gestopt.</b>");
    }
</script>

</body>
</html>
