<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker, Waken & Camera</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 15px; text-align: center; margin: 0; }
        #app-container { max-width: 500px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #map { width: 100%; height: 180px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ccc; }
        .optie-box { text-align: left; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; font-size: 14px; border-radius: 8px; cursor: pointer; flex: 1; }
        button.waken { background-color: #17a2b8; }
        button.stop { background-color: #dc3545; }
        #log { margin-top: 15px; text-align: left; background: #eee; padding: 10px; border-radius: 6px; height: 100px; overflow-y: auto; font-size: 12px; }
        #black-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; color: #555; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        #camera-preview { display: none; } /* Verborgen webcam-element voor foto's */
    </style>
</head>
<body>

    <div id="app-container">
        <h2>GPS Tracker & Waken</h2>
        <div id="map"></div>
        
        <div class="optie-box">
            <label><input type="checkbox" id="gebruik-zwart-scherm" checked> Start met zwart scherm</label><br><br>
            <label>Update interval: 
                <select id="update-interval">
                    <option value="60000">1 minuut</option>
                    <option value="300000">5 minuten</option>
                    <option value="900000">15 minuten</option>
                    <option value="1800000" selected>30 minuten (Half uur)</option>
                </select>
            </label><br><br>
            <label>Camera voor foto's: 
                <select id="camera-keuze">
                    <option value="user">Voorste camera (Selfie)</option>
                    <option value="environment" selected>Achterste camera</option>
                </select>
            </label>
        </div>

        <p id="status-tekst" style="font-size: 13px;">Klaar om te starten</p>
        
        <div class="btn-group">
            <button id="main-btn" onclick="startRit()">Start Rit</button>
            <button id="waken-btn" class="waken" onclick="startWaken()">Modus Waken</button>
        </div>
        
        <button id="stop-btn" class="stop" onclick="stopTracking()" style="display:none; width:100%; margin-top:10px;">Stop Actie</button>
        
        <div id="log">Nog niet gestart...</div>
    </div>

    <!-- Verborgen video element om foto's te maken via HTML5 -->
    <video id="camera-preview" autoplay playsinline></video>

    <div id="black-screen" onclick="checkUnlock()">
        <h2>Actief op achtergrond...</h2>
        <p style="color: #333; font-size: 12px;">(Tik 3 keer snel om te ontgrendelen)</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    let mode = null; // 'rit' of 'waken'
    let watchId = null;
    let wakeLock = null;
    let tapCount = 0;
    let map = null, marker = null, polyline = null, routeCoordinates = [];
    let ritStartTijdObj = null, ritStartTijdStr = "", ritStartAdres = "", laatsteAdres = "";
    let lastLiveSend = 0;

    const googleScriptUrl = "https://script.google.com/macros/s/AKfycbz6Zd0ChMLyO-qp6pRZx86yuGNlgzTHcNr6cMo_B9L8M_C7l0FbNw43PQSz1tK9gl_rAg/exec";

    window.onload = function() {
        map = L.map('map').setView([52.3676, 4.9041], 13);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);
        polyline = L.polyline([], {color: 'red', weight: 4}).addTo(map);
    };

    async function startRit() {
        mode = 'rit';
        routeCoordinates = [];
        polyline.setLatLngs([]);
        ritStartTijdObj = new Date();
        ritStartTijdStr = ritStartTijdObj.toLocaleTimeString();
        ritStartAdres = "Adres wordt bepaald...";
        
        uiActief(true);
        aanheffenBeveiliging();
        logMessage("🚗 Rit gestart met automatische updates.");
    }

    async function startWaken() {
        mode = 'waken';
        ritStartTijdObj = new Date();
        ritStartTijdStr = ritStartTijdObj.toLocaleTimeString();
        ritStartAdres = "Adres wordt bepaald...";
        
        uiActief(true);
        aanheffenBeveiliging();
        logMessage("🛡️ Waken / Standby-modus geactiveerd.");
    }

    async function aanheffenBeveiliging() {
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}

        if ("geolocation" in navigator) {
            watchId = navigator.geolocation.watchPosition(successPosition, errorPosition, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
        }

        if (document.getElementById('gebruik-zwart-scherm').checked) {
            document.getElementById('black-screen').style.display = 'flex';
        }
    }

    function uiActief(bezig) {
        document.getElementById('main-btn').style.display = bezig ? 'none' : 'block';
        document.getElementById('waken-btn').style.display = bezig ? 'none' : 'block';
        document.getElementById('stop-btn').style.display = bezig ? 'block' : 'none';
        document.getElementById('status-tekst').innerText = mode === 'rit' ? "Rit is bezig..." : "Waken is actief...";
    }

    async function neemFotoEnVerstuur(lat, lon, adres) {
        let fotoData = "";
        try {
            const facingMode = document.getElementById('camera-keuze').value;
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
            const video = document.getElementById('camera-preview');
            video.srcObject = stream;
            await new Promise(resolve => setTimeout(resolve, 800)); // Even wachten op belichting

            const canvas = document.createElement('canvas');
            canvas.width = 400; // Klein gehouden voor snelle verzending
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            fotoData = canvas.toDataURL('image/jpeg', 0.6); // Gecomprimeerde jpeg

            // Stop camera streams direct
            stream.getTracks().forEach(track => track.stop());
        } catch (e) {
            console.log("Camera niet beschikbaar of geweigerd:", e);
        }

        // Versturen naar Google Sheets
        if (googleScriptUrl) {
            fetch(googleScriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: "live",
                    tijd: new Date().toLocaleTimeString(),
                    lat: lat,
                    lon: lon,
                    adres: adres,
                    foto: fotoData
                })
            }).catch(err => console.log(err));

            logMessage("📸 Update met foto verzonden.");
        }
    }

    async function successPosition(position) {
        if (!mode) return;
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const latLng = [lat, lon];
        
        if (map) {
            if (!marker) marker = L.marker(latLng).addTo(map);
            else marker.setLatLng(latLng);
            map.setView(latLng, 15);
            routeCoordinates.push(latLng);
            polyline.setLatLngs(routeCoordinates);
        }

        let adres = `GPS Locatie (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await res.json();
            if (data && data.display_name) adres = data.display_name;
        } catch (e) {}

        if (ritStartAdres === "Adres wordt bepaald..." || ritStartAdres.includes("GPS Locatie")) {
            ritStartAdres = adres;
        }
        laatsteAdres = adres;

        const gekozenInterval = parseInt(document.getElementById('update-interval').value);
        const now = new Date().getTime();
        
        // Als het interval verstreken is, sturen we de update inclusief een nieuwe foto!
        if (now - lastLiveSend > gekozenInterval) {
            lastLiveSend = now;
            await neemFotoEnVerstuur(lat, lon, laatsteAdres);
        }
    }

    function errorPosition(error) { logMessage("GPS Fout: " + error.message); }

    function stopTracking() {
        const oudeMode = mode;
        mode = null;
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
        
        document.getElementById('black-screen').style.display = 'none';
        uiActief(false);
        
        if (oudeMode === 'rit') {
            const ritEindTijdObj = new Date();
            const duurMinuten = Math.round((ritEindTijdObj - ritStartTijdObj) / 60000);
            logMessage(`🏁 Rit gestopt. Duur: ${duurMinuten} min.`);

            if (googleScriptUrl) {
                fetch(googleScriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: "rit",
                        startTijd: ritStartTijdStr,
                        startPlaats: ritStartAdres,
                        eindTijd: ritEindTijdObj.toLocaleTimeString(),
                        eindPlaats: laatsteAdres,
                        duur: `${duurMinuten} minuten`
                    })
                }).catch(err => console.log(err));
            }
        } else {
            logMessage("🛡️ Waken gestopt.");
        }
    }

    function logMessage(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += msg + "<br>";
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function checkUnlock() {
        tapCount++;
        setTimeout(() => { tapCount = 0; }, 1000);
        if (tapCount >= 3 && confirm("Actie stoppen?")) stopTracking();
    }
</script>
</body>
</html>
