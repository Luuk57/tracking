<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking & Adres Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
            margin: 0;
            text-align: center;
        }
        #app-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        #log {
            margin-top: 20px;
            text-align: left;
            background: #eee;
            padding: 10px;
            border-radius: 6px;
            height: 220px;
            overflow-y: auto;
            font-size: 13px;
        }
        #black-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            color: #555;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #black-screen h2 { color: #222; font-size: 16px; }
    </style>
</head>
<body>

    <div id="app-container">
        <h2>GPS Tracker & Adressen</h2>
        <p>Zet de tracking aan, het scherm wordt zwart.</p>
        
        <button onclick="startTracking()">Start Tracking & Zwart Scherm</button>
        
        <h3>Logboek:</h3>
        <div id="log">Nog niet gestart...</div>
    </div>

    <div id="black-screen" onclick="checkUnlock()">
        <h2>App draait op achtergrond...</h2>
        <p style="color: #333; font-size: 12px;">(Tik 3 keer snel hier om te ontgrendelen)</p>
    </div>

<script>
    let watchId = null;
    let wakeLock = null;
    let tapCount = 0;
    let lastLogTime = 0;
    
    // Jouw Google Apps Script URL
    const googleScriptUrl = "https://script.google.com/macros/s/AKfycbz6Zd0ChMLyO-qp6pRZx86yuGNlgzTHcNr6cMo_B9L8M_C7l0FbNw43PQSz1tK9gl_rAg/exec"; 

    // HIER KUN JE DE TIJD AANPASSEN (in milliseconden)
    // 10000 = 10 seconden | 30000 = 30 seconden | 60000 = 1 minuut
    const intervalTijdMS = 10000; 

    async function startTracking() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                logMessage("Wake Lock ingeschakeld.");
            }
        } catch (err) {
            logMessage("Wake Lock fout: " + err.message);
        }

        if ("geolocation" in navigator) {
            logMessage("Start GPS-zoektocht (Interval: " + (intervalTijdMS / 1000) + " sec)...");
            watchId = navigator.geolocation.watchPosition(successPosition, errorPosition, {
                enableHighAccuracy: true,
                maximumAge: 10000,
                timeout: 20000
            });
        } else {
            alert("Geen GPS beschikbaar.");
        }

        document.getElementById('black-screen').style.display = 'flex';
    }

    async function successPosition(position) {
        const now = new Date().getTime();

        // Controleer of er genoeg tijd verstreken is sinds de vorige meting
        if (now - lastLogTime < intervalTijdMS) {
            return; // Sla deze meting over
        }
        lastLogTime = now;

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const tijdstip = new Date().toLocaleTimeString();
        
        // Vertaal coördinaten naar een leesbaar adres via OpenStreetMap
        let adres = "Adres aan het ophalen...";
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await response.json();
            if (data && data.display_name) {
                adres = data.display_name;
            }
        } catch (e) {
            adres = "Kon adres niet laden";
        }

        logMessage(`[${tijdstip}] <br>📍 <b>${adres}</b>`);

        // Stuur door naar Google Spreadsheet
        if (googleScriptUrl) {
            fetch(googleScriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tijd: tijdstip, lat: lat, lon: lon, adres: adres })
            }).catch(err => console.log("Google sync fout:", err));
        }
    }

    function errorPosition(error) {
        logMessage("GPS Fout: " + error.message);
    }

    function logMessage(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += msg + "<br><hr>";
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function checkUnlock() {
        tapCount++;
        setTimeout(() => { tapCount = 0; }, 1000);
        if (tapCount >= 3) {
            if (confirm("Wil je de tracking stoppen?")) {
                stopTracking();
            }
        }
    }

    function stopTracking() {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
        document.getElementById('black-screen').style.display = 'none';
        logMessage("<b>Tracking gestopt.</b>");
    }
</script>

</body>
</html>
